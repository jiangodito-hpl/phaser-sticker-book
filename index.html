<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Sticker Book - Phaser</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #f4ead2;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
      }
      body::before {
        content: "";
        position: fixed;
        inset: -24px;
        pointer-events: none;
        z-index: 0;
        opacity: 0;
        background: rgba(0, 0, 0, 0.75);
      }
      body.tutorial-overlay-active::before {
        opacity: 1;
      }
      html.tutorial-overlay-active,
      body.tutorial-overlay-active,
      body.tutorial-overlay-active #game {
        background: #404040;
      }
      body.endcard-overlay-active::before {
        opacity: 1;
        background: rgba(27, 16, 48, 0.55);
      }
      html.endcard-overlay-active,
      body.endcard-overlay-active,
      body.endcard-overlay-active #game {
        background: #1b1030;
      }
      #game {
        position: fixed;
        inset: 0;
        z-index: 1;
      }
      #loading-screen {
        position: fixed;
        inset: 0;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f4ead2;
      }
      .phone {
        --screen-clr: #0d85aa;
        --border-clr: #29536d;
        --loader-clr: #cce3de;
        background-color: var(--screen-clr);
        height: min(13rem, 48vh);
        aspect-ratio: 10 / 16;
        border-radius: 0.5rem;
        border: 5px solid var(--border-clr);
        border-top: 10px solid var(--border-clr);
        border-bottom: 10px solid var(--border-clr);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        animation: shake 0.5s infinite linear;
        position: relative;
      }
      .phone::after {
        content: "";
        position: absolute;
        top: -7px;
        left: 50%;
        transform: translateX(-50%);
        width: 1rem;
        height: 5px;
        background-color: var(--loader-clr);
        border-radius: 0.5rem;
      }
      .loader {
        border: 10px dashed var(--loader-clr);
        width: 2rem;
        height: 2rem;
        padding: 1.7rem;
        border-radius: 50%;
        animation: loading 2s infinite ease-in-out;
      }
      .text {
        color: var(--loader-clr);
        font-family: Arial, sans-serif;
        font-weight: 700;
      }
      @keyframes loading {
        0% {
          rotate: 0deg;
        }
        100% {
          rotate: 360deg;
        }
      }
      @keyframes shake {
        0% {
          rotate: 0deg;
        }
        10% {
          rotate: 0.5deg;
        }
        20% {
          rotate: 0deg;
        }
        30% {
          rotate: -0.5deg;
        }
        50% {
          rotate: 0deg;
        }
        100% {
          rotate: 0deg;
        }
      }
      canvas {
        display: block;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="loading-screen" aria-label="Loading">
      <div class="phone">
        <span class="loader"></span>
        <span class="text">Loading...</span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
