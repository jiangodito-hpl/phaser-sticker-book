<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Sticker Book - Phaser</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #f4ead2;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
      }
      body::before {
        content: "";
        position: fixed;
        inset: -24px;
        pointer-events: none;
        z-index: 0;
        opacity: 0;
        background: rgba(0, 0, 0, 0.75);
      }
      body.tutorial-overlay-active::before {
        opacity: 1;
      }
      html.tutorial-overlay-active,
      body.tutorial-overlay-active,
      body.tutorial-overlay-active #game {
        background: #404040;
      }
      body.endcard-overlay-active::before {
        opacity: 1;
        background: rgba(27, 16, 48, 0.55);
      }
      html.endcard-overlay-active,
      body.endcard-overlay-active,
      body.endcard-overlay-active #game {
        background: #1b1030;
      }
      #game {
        position: fixed;
        inset: 0;
        z-index: 1;
      }
      #loading-screen {
        position: fixed;
        inset: 0;
        z-index: 2;
        display: grid;
        align-items: center;
        justify-content: center;
        background: #1b1030;
        font-family: Arial, sans-serif;
      }
      .loading-endcard {
        width: min(78vw, 360px);
        min-height: min(72vh, 560px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: clamp(18px, 4vh, 34px);
      }
      .loading-endcard__logo {
        width: min(54vw, 260px);
        height: auto;
        display: block;
        animation: loading-logo 1.2s infinite ease-in-out;
      }
      .loading-progress {
        width: min(64vw, 310px);
        height: 12px;
        border: 2px solid rgba(255, 255, 255, 0.9);
        border-radius: 999px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.18);
      }
      .loading-progress__bar {
        width: 0%;
        height: 100%;
        border-radius: inherit;
        background: #ffffff;
        transition: width 120ms ease-out;
      }
      .loading-progress__text {
        min-height: 20px;
        color: #ffffff;
        font-size: 16px;
        font-weight: 700;
      }
      .loading-endcard__button {
        width: min(60vw, 300px);
        height: auto;
        display: block;
        opacity: 0.92;
        animation: loading-button 900ms infinite ease-in-out;
      }
      @keyframes loading-logo {
        0%,
        100% {
          transform: translateY(0) rotate(-1deg);
        }
        50% {
          transform: translateY(-8px) rotate(1deg);
        }
      }
      @keyframes loading-button {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.04);
        }
      }
      canvas {
        display: block;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="loading-screen" aria-label="Loading">
      <div class="loading-endcard">
        <img id="loading-logo" class="loading-endcard__logo" alt="" />
        <div class="loading-progress" aria-hidden="true">
          <div id="loading-progress-bar" class="loading-progress__bar"></div>
        </div>
        <div id="loading-progress-text" class="loading-progress__text">0%</div>
        <img id="loading-cta" class="loading-endcard__button" alt="" />
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
